<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Pizza Box Agent{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23F57C00'/%3E%3Ccircle cx='32' cy='32' r='30' fill='none' stroke='%23FBF9F6' stroke-width='3' stroke-dasharray='6 5'/%3E%3Ctext x='32' y='43' font-family='Arial, sans-serif' font-weight='800' font-size='34' fill='%23FBF9F6' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="/static/css/dashboard.css" rel="stylesheet">
  {% block styles %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark fixed-top navbar-brand-custom">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center gap-2" href="/">
      <i class="bi bi-box-seam fs-4"></i>
      <span>Pizza Box <span class="fw-normal" style="opacity:0.7">Agent</span></span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-4">
        <li class="nav-item">
          <a class="nav-link {% if active_page == 'dashboard' %}active{% endif %}" href="/">
            <i class="bi bi-speedometer2"></i> Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if active_page == 'funnel' %}active{% endif %}" href="/funil">
            <i class="bi bi-kanban"></i> Funil
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if active_page == 'clients' %}active{% endif %}" href="/clientes">
            <i class="bi bi-people"></i> Clientes
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if active_page == 'crm' %}active{% endif %}" href="/crm/funil">
            <i class="bi bi-funnel"></i> CRM
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if active_page == 'catalog' %}active{% endif %}" href="/catalogo">
            <i class="bi bi-grid-3x3-gap"></i> Catalogo
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if active_page == 'ai_test' %}active{% endif %}" href="/teste/ia-caixa">
            <i class="bi bi-stars"></i> Teste IA
          </a>
        </li>
      </ul>
      <ul class="navbar-nav ms-auto gap-2 align-items-center">
        <li class="nav-item">
          <a class="btn btn-new-order btn-sm px-3 py-1" href="/pedidos/novo">
            <i class="bi bi-plus-lg"></i> Novo Pedido
          </a>
        </li>
        {% if user %}
        <li class="nav-item dropdown">
          <a class="nav-link py-1 px-2 dropdown-toggle {% if active_page == 'configuracoes' %}active{% endif %}"
             href="#" role="button" data-bs-toggle="dropdown" title="Configuracoes" style="font-size:0.8rem">
            <i class="bi bi-gear"></i>
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="/configuracoes/whatsapp"><i class="bi bi-whatsapp"></i> Integracao WhatsApp</a></li>
            <li><a class="dropdown-item" href="/configuracoes/conta"><i class="bi bi-person-lock"></i> Minha Conta</a></li>
          </ul>
        </li>
        <li class="nav-item">
          <a class="nav-link py-1 px-2" href="/logout" style="font-size:0.8rem; opacity:0.7">
            <i class="bi bi-box-arrow-right"></i> Sair
          </a>
        </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>

<main class="container-fluid" style="margin-top: 72px; padding: 24px;">
  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/htmx.org@2.0.4"></script>
<script src="/static/js/dashboard.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
