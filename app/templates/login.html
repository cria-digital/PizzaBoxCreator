<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Pizza Box Agent</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23F57C00'/%3E%3Ccircle cx='32' cy='32' r='30' fill='none' stroke='%23FBF9F6' stroke-width='3' stroke-dasharray='6 5'/%3E%3Ctext x='32' y='43' font-family='Arial, sans-serif' font-weight='800' font-size='34' fill='%23FBF9F6' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-orange: #F57C00;
      --brand-orange-dark: #E65100;
      --brand-black: #1B1712;
      --brand-dark: #26201A;
    }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        repeating-linear-gradient(
          115deg,
          rgba(255, 255, 255, 0.03) 0px,
          rgba(255, 255, 255, 0.03) 2px,
          transparent 2px,
          transparent 9px
        ),
        linear-gradient(160deg, var(--brand-black) 0%, var(--brand-dark) 100%);
    }
    .login-card {
      background: #FBF9F6;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      border-top: 4px solid var(--brand-orange);
    }
    .brand-icon {
      width: 64px;
      height: 64px;
      background: var(--brand-orange);
      border-radius: 50%;
      border: 2px dashed rgba(255, 255, 255, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 28px;
      color: #fff;
    }
    .form-control:focus {
      border-color: var(--brand-orange);
      box-shadow: 0 0 0 3px rgba(245, 124, 0, 0.15);
    }
    .btn-login {
      background: var(--brand-orange);
      border: none;
      color: #fff;
      font-weight: 700;
      border-radius: 10px;
      padding: 12px;
      width: 100%;
      font-size: 1rem;
      transition: all 0.2s;
    }
    .btn-login:hover {
      background: var(--brand-orange-dark);
      color: #fff;
      box-shadow: 0 4px 16px rgba(245, 124, 0, 0.35);
    }
    .error-msg {
      background: #FFF3E0;
      border: 1px solid var(--brand-orange);
      color: var(--brand-orange-dark);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand-icon">
      <i class="bi bi-box-seam"></i>
    </div>
    <h4 class="text-center fw-bold mb-1" style="color: #1B1712">Pizza Box Agent</h4>
    <p class="text-center text-muted mb-4" style="font-size: 0.85rem">Acesse o painel de controle</p>

    {% if error %}
    <div class="error-msg mb-3">
      <i class="bi bi-exclamation-circle"></i> {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login">
      <input type="hidden" name="next" value="{{ next_url or '/' }}">
      <div class="mb-3">
        <label class="form-label fw-semibold" style="font-size: 0.85rem">Usuario</label>
        <input type="text" name="username" class="form-control" placeholder="admin" required autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold" style="font-size: 0.85rem">Senha</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-login">
        <i class="bi bi-box-arrow-in-right"></i> Entrar
      </button>
    </form>
  </div>
<script src="/static/js/dashboard.js"></script>
</body>
</html>
