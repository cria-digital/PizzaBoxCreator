[project]
name = "pizza-box-agent"
version = "0.1.0"
description = "AI Agent for automated pizza box packaging design"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "PhotoshopAPI>=0.9.0",
    "Pillow>=10.0.0",
    "anthropic>=0.50.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "httpx>=0.27.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.12",
    "jinja2>=3.1.0",
    "pypdf>=6.0.0",
    "itsdangerous>=2.2.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "requests>=2.31.0",
]
# Background removal for client logos (local ONNX model). Heavy (~170MB model on first use),
# so kept optional. Without it, logos are composited as-is. See app/services/logo_service.py.
logo = [
    "rembg>=2.0.50",
    "onnxruntime>=1.16.0",
]
# Google Gemini as an alternative AI provider (Claude works out of the box via `anthropic`).
gemini = [
    "google-genai>=1.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.scripts]
pizza-box = "app.main:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
